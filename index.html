        .mini-test-options button.wrong { background: #dc2626; color: white; border-color: #dc2626; }
        
        .chat-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(13, 17, 23, 0.98); z-index: 100; display: none; flex-direction: column; animation: slideUp 0.3s ease-out; }

        .msg.bot { background-color: var(--bg-sidebar); border: 1px solid var(--border-color); align-self: flex-start; color: var(--text-main); }
        .msg.user { background-color: var(--accent); color: white; align-self: flex-end; }

        .auth-modal.active, .profile-modal.active { display: flex; }
        .modal-content { background-color: var(--bg-panel); border: 1px solid var(--border-color); padding: 40px; border-radius: 12px; width: 400px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 20px 0; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; border-radius: 8px; outline: none; }
        .modal-content button { width: 100%; padding: 12px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

            .layout-container { flex-direction: column; height: calc(100vh - 60px - 60px); }

    </style>
</head>

# #30 VORISLIK VA POLIMORFIZM

### 1. Vorislik (Inheritance)
Ota (Super) klassdagi barcha xususiyatlarni Bola (Sub) klassga ko'chirib o'tkazish. Bu kod takrorlanishining oldini oladi.
<pre><code>class Shaxs:
    def __init__(self, ism, familiya):
        self.ism = ism
        self.familiya = familiya

    def __init__(self, ism, familiya, id_raqam):

        self.id_raqam = id_raqam

t = Talaba("Kamron", "Dasturchiyev", "ID12345")
print(t.ism) # Ota klassning xususiyati ishladi!</code></pre>

### 2. Polimorfizm (Qayta yozish - Overriding)
Agar Ota klassdagi metod Bola klassga to'g'ri kelmasa (yoki uni o'zgartirish kerak bo'lsa), o'sha nomdagi metod bola klassda qayta yoziladi.
<pre><code>class Shaxs:

class Talaba(Shaxs):
    def info(self): return "Men talabaman, o'qishim kerak." # Qayta yozildi

sh = Shaxs()
print(sh.info())
tal = Talaba()
print(tal.info())</code></pre>

### 3. Multiple Inheritance (Ko'p Vorislik)
Python bir vaqtning o'zida ikkita har xil Ota klassdan bitta Bola klassga meros olishga ruxsat beradi (\`class Bola(Ota1, Ota2):\`), lekin bu murakkablikni oshirgani uchun ko'p tavsiya etilmaydi.

Vorislik yordamida biz "Foydalanuvchi" degan katta klass ochib, keyin undan "Admin", "Mijoz", "Sotuvchi" degan kichik klasslarni bitta qatorda yaratib olishimiz mumkin.

# #31 INKAPSULYATSIYA

### 1. Ma'lumotlarni yashirish (Encapsulation)
Klass ichidagi ba'zi sezgir xususiyatlar (parollar, plastik karta balansi) ni tashqaridan turib hech kim to'g'ridan-to'g'ri o'zgartirib yoki ko'ra olmasligini ta'minlash.

### 2. Public, Protected va Private
Pythonda ma'lumotni himoyalashning 3 bosqichi bor:
* **Public (Ochiq):** \`self.ism\` (hamma ko'radi)
* **Protected (Himoyalangan):** \`self._telefon\` (1 ta pastki chiziq. Faqat o'zi va vorislar ishlatsin degan ogohlantirish, lekin cheklov yo'q).
* **Private (Yopiq):** \`self.__balans\` (2 ta chiziq. Hech kim tashqaridan aralasha olmaydi).

### 3. Private Xususiyat bilan ishlash
<pre><code>class Karta:
    def __init__(self, raqam, pin):
        self.raqam = raqam
        self.__pin = pin # Private xususiyat
        self.__balans = 10000

karta = Karta("86001234", 1111)
print(karta.raqam)
# print(karta.__balans) # XATO! Tashqaridan ko'rinmaydi.</code></pre>

### 4. Private ma'lumotni o'qish/o'zgartirish (Getter, Setter)
Yopiq ma'lumotga faqat klassning ichidan, maxsus metodlar orqali yetishiladi.
<pre><code>class Karta:
    # ...
    def get_balans(self): # Getter
        return self.__balans
        
    def pul_yechish(self, summa): # Setter/Updater
        if summa <= self.__balans:
            self.__balans -= summa
            return "Muvaffaqiyatli!"
        return "Mablag' yetarli emas."</code></pre>

# #35 XATOLAR BILAN ISHLASH (Try-Except)

### 1. Kutilmagan Xatoliklar (Exceptions)
Dasturingiz to'g'ri yozilgan bo'lsa ham, ba'zida server uzilishi yoki foydalanuvchi "Yosh" so'ralgan joyga "Yigirma" deb matn kiritib yuborishi orqali dastur Crash beradi (To'xtab qoladi).

### 2. Try - Except Bloki (Dasturni qutqarish)
\`try\` blokiga "shubhali" kod yoziladi. Agar kod xatosiz ishlasa, \`except\` ga umuman o'tilmaydi. Agar xato yuz bersa, dastur qotib qolmasdan \`except\` dagi zaxira matnni chiqaradi.
<pre><code>yil = input("Tug'ilgan yilingiz: ")

    yosh = 2026 - int(yil)
    print(f"Yoshingiz: {yosh}")
except ValueError:
    print("Xato! Iltimos faqat raqam kiriting.")
print("Dastur ishlashda davom etmoqda...")</code></pre>

### 3. Xato turini ushlab olish (ZeroDivisionError)
Nolga bo'lish kabi xatoliklarni aniq ushlash mumkin.
<pre><code>try:
    print(10 / 0)
except ZeroDivisionError:
    print("Sonni 0 ga bo'lib bo'lmaydi!")</code></pre>

### 4. Else va Finally
* \`else:\` - Try ichida xato bo'lmagandagina ishlaydi.
* \`finally:\` - Xato bo'lsa ham, bo'lmasa ham OXIRIDA albatta ishlaydigan blok (masalan DB ulanishini yopish).

### 3. Oltin Qoida: "C.R.E.A.T.E" Formulasi
AI dan aniq va xatosiz kod olish uchun prompt ichida quyidagi qismlar aniq yozilgan bo'lishi shart:
* **C - Character (Rol):** AI ga mutaxassis rolini bering ("Sen Senior Python Backend dasturchisisan").
* **R - Request (Vazifa):** Nima qilish kerakligini aniq ayting.
* **E - Examples (Misollar):** Qanday natija kutayotganingizni namuna qilib ko'rsating.
* **A - Adjustments (Cheklovlar):** Nimalarni ishlatish mumkin emasligini qat'iy uqtiring ("Faqat aiogram 3 ishlat, telebot emas").
* **T - Type (Format):** Javob qanday formatda bo'lishini bildiring ("Kodni tayyor fayl qilib ber" yoki "Faqat o'zgargan qatorni ko'rsat").

### 4. Ideal Prompt Shabloni
Quyida to'g'ri yozilgan professional prompt namunasini ko'rib chiqing.
<pre><code>Rol: Sen 10 yillik tajribaga ega Python va FastAPI arxitektorisan.
Vazifa: Menga foydalanuvchilarni ro'yxatdan o'tkazuvchi (Register) API yozib ber.
Cheklovlar: Ma'lumotlar bazasi uchun faqat SQLAlchemy 2.0 va async ishlat. Parollarni heshlash qismi o'zbekcha yozilsin.
Format: Kodni har bir qatoriga izoh (comment) qoldirib, OOP class ko'rinishida taqdim et.</code></pre>

            applyTheme(localStorage.getItem('theme') === 'light');
            let sc = localStorage.getItem('saved_draft_code');
            if (sc) document.getElementById('code-editor').value = sc;
            document.getElementById('code-editor').addEventListener('input', (e) => localStorage.setItem('saved_draft_code', e.target.value));
            checkAuth();
            if (courseLessons.length > 0) loadLesson(activeLesson);
            initPyodide();
        }

        async function initPyodide() {
            const term = document.getElementById('terminal-output');
            try {
                pyodide = await loadPyodide({
                    stdout: (t) => { term.innerHTML += t + '\n'; term.scrollTop = term.scrollHeight; },
                    stderr: (t) => { term.innerHTML += `<span style="color: #ef4444;">${t}</span>\n`; term.scrollTop = term.scrollHeight; }
                });
                term.innerHTML = "Tizim tayyor. Python 3 kodini yozib ishga tushiring.\n>_ \n";
            } catch (err) { term.innerHTML = `<span style="color: #ef4444;">Tizim yuklash xatosi: ${err}</span>`; }
        }

        async function runPython() {
            if (!pyodide) { alert("Python muhiti yuklanmoqda, kuting..."); return; }
            const code = document.getElementById('code-editor').value;
            const term = document.getElementById('terminal-output');
            term.innerHTML += `<span style="color:#8b949e;">>>> Bajarilmoqda...</span>\n`;
            document.getElementById('run-btn').innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
            document.getElementById('run-btn').disabled = true;
            try { await pyodide.runPythonAsync(code); } 
            catch (err) { term.innerHTML += `<span style="color: #ff7b72;">${err}</span>\n`; } 
            finally { document.getElementById('run-btn').innerHTML = `<i class="fas fa-play"></i> Run Code`; document.getElementById('run-btn').disabled = false; term.scrollTop = term.scrollHeight; }
        }

        function clearTerminal() { document.getElementById('terminal-output').innerHTML = ">_ \n"; }
        function toggleChat() { document.getElementById('chat-modal').classList.toggle('active'); }
        function sendMessage() {
            const el = document.getElementById('chat-input');
            if(!el.value.trim()) return;
            let msg = el.value; el.value = '';
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="msg user">${msg}</div>`;
            document.getElementById('chat-loader').classList.add('active');
            box.scrollTop = box.scrollHeight;
            setTimeout(() => {
                document.getElementById('chat-loader').classList.remove('active');
                box.innerHTML += `<div class="msg bot">Ajoyib savol! Hozircha Robo-Ustoz tarmog'i ulanmaganligi sababli, darsdagi ma'lumotlarni o'qib mustaqil o'rganishda davom eting.</div>`;
                box.scrollTop = box.scrollHeight;
            }, 800);
        }

        document.getElementById('code-editor').addEventListener('keydown', function(e) {
            if (e.key == 'Tab') { e.preventDefault(); let s = this.selectionStart; let en = this.selectionEnd; this.value = this.value.substring(0, s) + "    " + this.value.substring(en); this.selectionStart = this.selectionEnd = s + 4; }
        });

        window.onload = initApp;
    </script>
</body>
</html>
